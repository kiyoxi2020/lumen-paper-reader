<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen · 模型配置</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div class="grain"></div>

<header class="topbar">
  <div class="logo">
    <a href="index.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit">
      <span class="logo-mark">L</span>
      <span class="logo-text">Lumen</span>
    </a>
  </div>
  <nav class="topnav">
    <a href="index.html" class="nav-link">论文库</a>
    <a href="settings.html" class="nav-link active">模型配置</a>
  </nav>
</header>

<main class="settings-main">
  <div class="settings-container">
    <div class="settings-header">
      <h1>模型配置</h1>
      <p>配置后端大模型 API，支持 Anthropic、OpenAI、DeepSeek 等兼容 OpenAI 接口的服务</p>
    </div>

    <!-- Provider Cards -->
    <section class="settings-section">
      <div class="section-title">选择服务商</div>
      <div class="provider-grid" id="providerGrid">

        <div class="provider-card" data-provider="anthropic">
          <div class="provider-logo anthropic-logo">
            <svg viewBox="0 0 40 40" fill="none"><path d="M24.5 8L32 32H27L25.2 26.5H14.8L13 32H8L15.5 8H24.5ZM20 13.5L16.2 23.5H23.8L20 13.5Z" fill="currentColor"/></svg>
          </div>
          <div class="provider-name">Anthropic</div>
          <div class="provider-models">Claude 4.7 / Claude 4.6 / Haiku 4.5</div>
          <div class="provider-badge">推荐</div>
        </div>

        <div class="provider-card" data-provider="openai">
          <div class="provider-logo openai-logo">
            <svg viewBox="0 0 40 40" fill="none"><path d="M35.3 16.2a8.4 8.4 0 00-.7-6.9 8.7 8.7 0 00-9.4-4.2 8.4 8.4 0 00-6.3-2.8 8.7 8.7 0 00-8.3 6 8.4 8.4 0 00-5.6 4.1 8.7 8.7 0 001.1 10.2 8.4 8.4 0 00.7 6.9 8.7 8.7 0 009.4 4.2 8.4 8.4 0 006.3 2.8 8.7 8.7 0 008.3-6 8.4 8.4 0 005.6-4.1 8.7 8.7 0 00-1.1-10.2z" fill="currentColor"/></svg>
          </div>
          <div class="provider-name">OpenAI</div>
          <div class="provider-models">GPT-4o / o1 / GPT-4o Mini</div>
        </div>

        <div class="provider-card" data-provider="deepseek">
          <div class="provider-logo deepseek-logo">
            <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="14" stroke="currentColor" stroke-width="2.5"/><path d="M13 20h14M20 13v14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </div>
          <div class="provider-name">DeepSeek</div>
          <div class="provider-models">deepseek-chat / deepseek-r1</div>
          <div class="provider-badge cost">低成本</div>
        </div>

        <div class="provider-card" data-provider="custom">
          <div class="provider-logo custom-logo">
            <svg viewBox="0 0 40 40" fill="none"><rect x="8" y="8" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/><rect x="22" y="8" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/><rect x="8" y="22" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/><rect x="22" y="22" width="10" height="10" rx="2" stroke="currentColor" stroke-width="2"/></svg>
          </div>
          <div class="provider-name">自定义</div>
          <div class="provider-models">兼容 OpenAI 接口的任意服务</div>
        </div>

      </div>
    </section>

    <!-- Config Form -->
    <section class="settings-section" id="configSection">
      <div class="section-title">接口配置</div>
      <div class="config-form" id="configForm">

        <div class="field-group" id="fieldApiKey">
          <label class="field-label">API Key <span class="required">*</span></label>
          <div class="key-input-wrap">
            <input type="password" class="field-input" id="apiKey" placeholder="sk-…">
            <button class="toggle-eye" onclick="toggleKey()">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="field-hint">API Key 仅存储在浏览器本地，不会上传到任何服务器</div>
        </div>

        <div class="field-group" id="fieldBaseUrl">
          <label class="field-label">Base URL</label>
          <input type="text" class="field-input" id="baseUrl" placeholder="https://api.openai.com/v1">
          <div class="field-hint">留空则使用默认接口地址</div>
        </div>

        <div class="field-group">
          <label class="field-label">模型名称 <span class="required">*</span></label>
          <div class="model-select-wrap">
            <select class="field-input" id="modelSelect" onchange="onModelSelectChange()">
            </select>
            <input type="text" class="field-input hidden" id="modelCustomInput" placeholder="输入自定义模型名称">
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label class="field-label">最大 Token 数</label>
            <input type="number" class="field-input" id="maxTokens" value="2000" min="500" max="8000" step="500">
          </div>
          <div class="field-group">
            <label class="field-label">Temperature</label>
            <input type="number" class="field-input" id="temperature" value="0.7" min="0" max="2" step="0.1">
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">系统提示词（System Prompt）</label>
          <textarea class="field-input field-textarea" id="systemPrompt" rows="4">你是一位专业的学术论文分析助手。你的任务是帮助研究者深入理解论文内容。请用清晰简洁的中文回答，使用 Markdown 格式，适当使用标题、列表和代码块来组织内容。对于公式，请用文字或 LaTeX 格式描述。</textarea>
        </div>

        <div class="form-actions">
          <button class="btn-ghost" onclick="testConnection()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
            测试连接
          </button>
          <button class="btn-primary" onclick="saveConfig()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            保存配置
          </button>
        </div>

        <div class="test-result" id="testResult"></div>
      </div>
    </section>

    <!-- Current Config Summary -->
    <section class="settings-section">
      <div class="section-title">当前配置</div>
      <div class="config-summary" id="configSummary">
        <div class="summary-empty">尚未配置任何模型</div>
      </div>
    </section>

  </div>
</main>

<script src="js/store.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
